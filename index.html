<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#ECF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13201A" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<script>
  // Apps Script 網頁應用程式網址（結尾是 /exec）
  window.SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwlvdGsaGH9b7sa83vsq9XyoGUUPstpJybrgsHX0Vj7OyA_d1Ar8jLoC5_K6ejWRKdgCA/exec';
</script>
<style>
:root{
  --bg:#ECF1EE; --card:#FFFFFF; --ink:#16241D; --muted:#5D6E65; --line:#D3DCD7;
  --water:#2A6BB0; --water-soft:#D8E7F6; --water-ink:#FFFFFF;
  --leaf:#2E7A4B; --leaf-soft:#E1EFE5; --alert:#B3382B; --alert-soft:#F7E3E0; --amber:#B9821F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13201A; --card:#1C2B24; --ink:#E6EEE9; --muted:#9DB0A6; --line:#2E4038;
    --water:#5B9BE0; --water-soft:#1E3550; --water-ink:#0D1A12;
    --leaf:#6BC08A; --leaf-soft:#1F3A2B; --alert:#F08A7C; --alert-soft:#3D2420; --amber:#E0AE52;
  }
}
:root[data-theme="dark"]{
  --bg:#13201A; --card:#1C2B24; --ink:#E6EEE9; --muted:#9DB0A6; --line:#2E4038;
  --water:#5B9BE0; --water-soft:#1E3550; --water-ink:#0D1A12;
  --leaf:#6BC08A; --leaf-soft:#1F3A2B; --alert:#F08A7C; --alert-soft:#3D2420; --amber:#E0AE52;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}

/* 頂部 */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.date{font-size:15px;color:var(--muted)}
#sync{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 10px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
#sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
#sync.busy::before{background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent)}
#sync.err{color:var(--alert);border-color:var(--alert)}
#sync.err::before{background:var(--alert);box-shadow:0 0 0 3px var(--alert-soft)}
.remain{font-size:26px;font-weight:700;margin:2px 0 0}
.remain.clear{color:var(--leaf)}
.bar{display:flex;gap:10px;align-items:center;margin-top:12px}
.tabs{flex:1;display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;min-width:0}
.tab{flex:1;min-width:0;border:0;background:transparent;border-radius:9px;padding:8px 2px;font-size:15px;font-weight:600;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:5px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--water);color:var(--water-ink);font-size:12px;line-height:20px;font-weight:700}
.badge.zero{background:transparent;color:var(--leaf);padding:0;min-width:0}
.icon-btn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px}

/* 清單 */
h2{font-size:14px;font-weight:600;color:var(--muted);margin:22px 2px 8px}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.gauge{width:12px;flex:none;background:var(--water-soft);position:relative}
.gauge i{position:absolute;left:0;right:0;bottom:0;background:var(--water);transition:height .5s ease}
.card.overdue .gauge{background:var(--alert-soft)}
.body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:12px 10px 12px 14px;display:block}
.row1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name{font-size:18px;font-weight:700}
.qty{font-size:15px;color:var(--muted)}
.slot{font-size:13px;font-weight:600;color:var(--water);border:1px solid currentColor;border-radius:6px;padding:0 6px}
.amount{font-size:15px;margin-top:2px}
.amount b{font-weight:600}
.status{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.status.due{color:var(--water);font-weight:600}
.status.overdue{color:var(--alert);font-weight:600}
.status.done{color:var(--leaf);font-weight:600}
.warn{display:block;font-size:13px;color:var(--alert);margin-top:2px}
.side{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px;padding:12px 12px 12px 0}
.go{border:0;background:var(--water);color:var(--water-ink);font-weight:700;border-radius:999px;padding:12px 18px;font-size:16px;min-width:92px;white-space:nowrap}
.go.again{background:transparent;color:var(--water);box-shadow:inset 0 0 0 1.5px var(--water);padding:8px 14px;font-size:14px;min-width:0}
.go:active,.btn:active{transform:scale(.97)}
.undo{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}
.pending-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--card);border-radius:14px;border:1px dashed var(--line)}
.addrow{display:block;width:100%;margin-top:18px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:14px;padding:12px;font-size:15px}

/* 底部面板 */
.sheet-wrap{position:fixed;inset:0;z-index:20;visibility:hidden}
.sheet-wrap.open{visibility:visible}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s}
.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 20px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease}
.open .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh-head > div{flex:1;min-width:0}
.sh-head h3{font-size:22px;margin:0;line-height:1.3}
.meta{font-size:14px;color:var(--muted);margin:2px 0}
.sheet h4{font-size:14px;color:var(--muted);font-weight:600;margin:20px 0 8px}
.stats{list-style:none;margin:0;padding:0;background:var(--card);border-radius:12px}
.stats li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:15px}
.stats li + li{border-top:1px solid var(--line)}
.stats li span:last-child{color:var(--muted);text-align:right}
.logs{list-style:none;margin:0;padding:0;background:var(--card);border-radius:12px}
.logs li{display:flex;align-items:center;gap:12px;padding:9px 14px;font-size:15px}
.logs li + li{border-top:1px solid var(--line)}
.logs time{color:var(--muted);min-width:120px}
.logs li span{flex:1}
.logs .x{border:0;background:none;color:var(--alert);font-size:14px;padding:4px 6px}
.backfill{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.backfill .btn{grid-column:1 / -1}
.backfill input,.backfill select{min-width:0}
input,select,textarea{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%;-webkit-appearance:none;appearance:none;color:var(--ink)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type="checkbox"]{width:22px;height:22px;padding:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--water);flex:none;margin:0}
.btn{display:inline-flex;justify-content:center;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-size:16px;font-weight:600}
.btn.small{padding:7px 14px;font-size:15px}
.btn.primary{background:var(--water);border-color:var(--water);color:var(--water-ink)}
.btn.danger{color:var(--alert);background:transparent}
.btn.block{display:flex;width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.form label{display:block;margin-top:12px;font-size:14px;color:var(--muted)}
.form label > input,.form label > select{margin-top:5px}
.form small{display:block;margin-top:4px;font-size:13px}
.form .check{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;gap:10px;margin-top:20px}
.form-actions .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--water);background:var(--water-soft)}
.chip .rm{color:var(--alert);font-weight:700}
.addp{display:flex;gap:8px;margin-top:10px}
.addp .btn{flex:none}

/* 初次設定 */
.setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.setup .panel{width:100%;max-width:440px;background:var(--card);border-radius:18px;padding:22px}
.setup h3{margin:0 0 4px;font-size:20px}
.setup p{margin:4px 0 14px;color:var(--muted);font-size:15px}
.errtext{color:var(--alert);font-size:14px;min-height:20px;margin-top:8px}

.toast{position:fixed;z-index:30;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;gap:10px;align-items:center;font-size:15px;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{min-width:0}
.toast button{flex:none;white-space:nowrap;border:0;background:transparent;color:var(--bg);font-weight:700;padding:6px 8px;text-decoration:underline}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-wrap" id="sheetWrap">
  <div class="backdrop" data-close></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- 本機資料 ---------- */
const LS = { cfg: 'pw_cfg', cache: 'pw_cache', pending: 'pw_pending', zone: 'pw_zone' };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let cfg = load(LS.cfg, { key: '', person: '' });
let data = load(LS.cache, null);        // { plants, people, logs, serverTime }
let pending = load(LS.pending, []);     // 還沒送到試算表的紀錄動作
let zone = load(LS.zone, '');
const sync = { busy: false, error: '', last: data ? data.serverTime : null, timer: null };
let setupStep = cfg.key ? (cfg.person ? null : 'person') : 'key';
let sheet = { mode: null, id: null };
let peopleEdit = false;

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const WD = '日一二三四五六';
const DEFAULT_ZONES = ['二樓室內', '一樓室內', '室外'];
const ACTIONS = ['澆水', '泡水', '換水', '噴水'];
const SLOTS = ['', '早上', '下班前'];
const VERB = { '澆水': '澆好了', '泡水': '泡好了', '換水': '換好了', '噴水': '噴好了' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ---------- 日期（以手機當地時間為準） ---------- */
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const numOf = key => { const [y, m, d] = key.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const dayOf = iso => numOf(keyOf(new Date(iso)));
const dateLabel = n => { const d = new Date(n * 864e5); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '（週' + WD[d.getUTCDay()] + '）'; };
const timeLabel = iso => { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const stamp = iso => dateLabel(dayOf(iso)) + ' ' + timeLabel(iso);
const todayNum = () => numOf(keyOf(new Date()));
const localInput = ms => { const d = new Date(ms); return keyOf(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

/* ---------- 合併試算表資料與還沒送出的動作 ---------- */
function allLogs() {
  const logs = data ? data.logs.slice() : [];
  const ids = new Set(logs.map(l => l.id));
  const removed = new Set(pending.filter(p => p.type === 'del').map(p => p.id));
  for (const p of pending) {
    if (p.type === 'log' && !ids.has(p.id)) logs.push({ id: p.id, time: p.clientTime, taskId: p.taskId, person: p.person, pending: true });
  }
  return logs.filter(l => !removed.has(l.id));
}
const plantById = id => data.plants.find(p => p.id === id);
const zonesOf = () => { const z = []; data.plants.forEach(p => { if (p.zone && !z.includes(p.zone)) z.push(p.zone); }); return z.length ? z : DEFAULT_ZONES.slice(); };

/* ---------- 固定日期排程 ---------- */
function computeTask(p, logs, t) {
  const n = p.interval;
  const start = p.start ? numOf(p.start) : t;
  const mine = logs.filter(l => l.taskId === p.id).sort((a, b) => new Date(b.time) - new Date(a.time));
  if (t < start) return { state: 'upcoming', next: start, level: 0, logs: mine };
  const cur = start + Math.floor((t - start) / n) * n;
  const next = cur + n;
  const inCycle = mine.filter(l => dayOf(l.time) >= cur);
  let missedPrev = null;
  if (n > 1 && cur - n >= start && !mine.some(l => { const d = dayOf(l.time); return d >= cur - n && d < cur; })) missedPrev = cur - n;
  if (inCycle.length) {
    const todayCount = mine.filter(l => dayOf(l.time) === t).length;
    return { state: 'done', cur, next, level: (next - t) / n, logs: mine, last: inCycle[0], todayCount };
  }
  if (cur === t) return { state: 'due', cur, next, level: 0, logs: mine, missedPrev };
  return { state: 'overdue', cur, next, level: 0, late: t - cur, logs: mine, missedPrev };
}

/* ---------- 與試算表溝通 ---------- */
const ERR = {
  bad_key: '通行碼不對，請到設定重新輸入',
  no_url: '還沒設定 Apps Script 網址',
  unknown_action: 'Apps Script 還是舊版，請更新程式碼並部署新版本',
  unknown_task: '找不到這一項，可能已被別人移除',
  missing_fields: '資料不完整'
};
async function api(payload) {
  if (!/^https:\/\/script\.google\.com\//.test(window.SCRIPT_URL)) throw new Error('no_url');
  let res, json;
  try { res = await fetch(window.SCRIPT_URL, { method: 'POST', body: JSON.stringify(Object.assign({ key: cfg.key }, payload)) }); }
  catch (e) { throw new Error('offline'); }
  try { json = await res.json(); } catch (e) { throw new Error('bad_response'); }
  if (!json.ok) throw new Error(json.error || 'server_error');
  return json;
}
const errText = e => ERR[e.message] || (e.message === 'offline' ? (navigator.onLine ? '連不上試算表，稍後自動重試' : '目前離線，連上網路後自動補傳') : '同步失敗：' + e.message);
const takeData = json => { data = { plants: json.plants, people: json.people, logs: json.logs, serverTime: json.serverTime }; save(LS.cache, data); };

async function flush() {
  while (pending.length) {
    const item = pending[0];
    try {
      if (item.type === 'log') await api({ action: 'log', id: item.id, taskId: item.taskId, person: item.person, clientTime: item.clientTime });
      else await api({ action: 'delLog', id: item.id });
    } catch (e) {
      if (e.message === 'unknown_task' || e.message === 'missing_fields') { /* 這筆已無法寫入，丟掉 */ }
      else throw e;
    }
    pending.shift(); save(LS.pending, pending);
  }
}

async function runSync() {
  if (!cfg.key) return;
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true; renderSync();
  try {
    await flush();
    takeData(await api({ action: 'data' }));
    sync.last = new Date().toISOString(); sync.error = '';
  } catch (e) {
    sync.error = errText(e);
  }
  sync.busy = false;
  refresh();
  if (sync.again) { sync.again = false; runSync(); }
}
const scheduleSync = (ms = 600) => { clearTimeout(sync.timer); sync.timer = setTimeout(runSync, ms); };

// 編輯植物、人員：需要連線，成功後直接用回傳的最新資料
async function mutate(payload, okMsg) {
  for (let i = 0; sync.busy && i < 60; i++) await new Promise(r => setTimeout(r, 250)); // 等背景同步跑完
  if (sync.busy) { toast('正在同步，請稍等再試'); return false; }
  clearTimeout(sync.timer);
  sync.busy = true; renderSync();
  try {
    await flush();
    takeData(await api(payload));
    sync.last = new Date().toISOString(); sync.error = '';
    sync.busy = false; refresh(true);
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    sync.busy = false; sync.error = e.message === 'offline' ? '' : errText(e); renderSync();
    toast(e.message === 'offline' ? '這個動作需要連線，請連上網路再試' : errText(e));
    return false;
  }
}

function renderSync() {
  const el = $('#sync');
  if (!el) return;
  const n = pending.length;
  el.className = sync.busy ? 'busy' : sync.error ? 'err' : n ? 'busy' : '';
  el.textContent = sync.busy ? '同步中' : sync.error ? (n ? n + ' 筆未同步' : '未同步') : n ? '等待同步' : '已同步';
  const st = $('#syncText');
  if (st) st.textContent = syncSummary();
}
function syncSummary() {
  if (sync.busy) return '正在同步…';
  let s = sync.error ? '上次同步失敗：' + sync.error : sync.last ? '最後同步：' + stamp(sync.last) : '尚未同步';
  if (pending.length) s += '，' + pending.length + ' 筆等待上傳';
  return s;
}

/* ---------- 紀錄動作 ---------- */
function addLog(taskId, person, ms) {
  const item = { type: 'log', id: uid(), taskId, person, clientTime: new Date(ms).toISOString() };
  pending.push(item); save(LS.pending, pending);
  scheduleSync();
  return item;
}
function removeLog(id) {
  const i = pending.findIndex(x => x.type === 'log' && x.id === id);
  if (i >= 0) pending.splice(i, 1);             // 還沒送出，直接拿掉
  else pending.push({ type: 'del', id });
  save(LS.pending, pending);
  scheduleSync();
}
function markDone(taskId, person = cfg.person, ms = Date.now()) {
  const p = plantById(taskId); if (!p) return;
  const item = addLog(taskId, person, ms);
  if (navigator.vibrate) navigator.vibrate(15);
  refresh();
  const who = person === cfg.person ? '' : '（' + person + '）';
  toast(p.name + (p.slot ? ' ' + p.slot : '') + ' 已' + p.action + who, () => { removeLog(item.id); refresh(); });
}

/* ---------- 提示 ---------- */
let toastTimer;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button">復原</button>' : '');
  if (undo) el.querySelector('button').onclick = () => { undo(); hideToast(); };
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 5000 : 2500);
}
const hideToast = () => $('#toast').classList.remove('show');

/* ---------- 主畫面 ---------- */
function render() {
  const app = $('#app');
  if (setupStep) { app.innerHTML = renderSetup(); bindSetup(); return; }
  if (!data) { app.innerHTML = '<div class="setup"><div class="panel"><h3>正在讀取資料</h3><p>' + esc(sync.error || '第一次開啟需要連線') + '</p></div></div>'; return; }

  const t = todayNum();
  const logs = allLogs();
  const zones = zonesOf();
  if (!zones.includes(zone)) zone = zones[0];
  const tasks = data.plants.map(p => Object.assign({ p }, computeTask(p, logs, t)));
  const isTodo = x => x.state === 'due' || x.state === 'overdue';
  const todo = tasks.filter(isTodo);
  const inZone = tasks.filter(x => x.p.zone === zone);
  const zTodo = inZone.filter(x => x.state === 'overdue').concat(inZone.filter(x => x.state === 'due'));
  const zRest = inZone.filter(x => !isTodo(x));

  app.innerHTML =
    '<div class="wrap"><header>' +
      '<div class="topline"><span class="date">' + esc(dateLabel(t)) + '</span><button type="button" id="sync" data-act="sync"></button></div>' +
      (todo.length ? '<div class="remain">今天還有 ' + todo.length + ' 項</div>' : '<div class="remain clear">今天都完成了</div>') +
      '<div class="bar"><div class="tabs" role="tablist">' + zones.map(z => {
        const c = todo.filter(x => x.p.zone === z).length;
        return '<button type="button" class="tab" role="tab" data-zone="' + esc(z) + '" aria-selected="' + (z === zone) + '">' + esc(z) +
          '<span class="badge' + (c ? '' : ' zero') + '">' + (c || '✓') + '</span></button>';
      }).join('') + '</div>' +
      '<button type="button" class="icon-btn" data-act="settings" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div>' +
    '</header><main>' +
      '<h2>待完成</h2><div class="list">' + (zTodo.length ? zTodo.map(cardHTML).join('') : '<div class="empty">這一區今天都處理好了</div>') + '</div>' +
      (zRest.length ? '<h2>已完成／還沒到期</h2><div class="list">' + zRest.map(cardHTML).join('') + '</div>' : '') +
      '<button type="button" class="addrow" data-act="add">新增「' + esc(zone) + '」的植物</button>' +
    '</main></div>';
  renderSync();
}

function cardHTML(x) {
  const p = x.p, t = todayNum();
  const qty = p.qty && p.qty !== '1' ? '<span class="qty">× ' + esc(p.qty) + ' 盆</span>' : '';
  const every = p.interval > 1 ? '<span class="qty">每 ' + p.interval + ' 天</span>' : '';
  const slot = p.slot ? '<span class="slot">' + esc(p.slot) + '</span>' : '';
  const verb = VERB[p.action] || '完成';
  let status = '', side = '';
  if (x.state === 'due') {
    status = '<span class="status due">今天要做</span>';
    side = '<button type="button" class="go" data-done="' + esc(p.id) + '">' + verb + '</button>';
  } else if (x.state === 'overdue') {
    status = '<span class="status overdue">逾期 ' + x.late + ' 天，原訂 ' + esc(dateLabel(x.cur)) + '</span>';
    side = '<button type="button" class="go" data-done="' + esc(p.id) + '">' + verb + '</button>';
  } else if (x.state === 'done') {
    const l = x.last, d = dayOf(l.time);
    status = '<span class="status done">' + esc(l.person) + ' ' + (d === t ? timeLabel(l.time) : esc(stamp(l.time))) + ' 完成' + (l.pending ? '<span class="pending-dot" title="等待同步"></span>' : '') + '</span>';
    if (p.multi && x.todayCount > 1) status += '<span class="status">今天共 ' + x.todayCount + ' 次</span>';
    if (p.interval > 1) status += '<span class="status">下次 ' + esc(dateLabel(x.next)) + '</span>';
    if (p.multi) side = '<button type="button" class="go again" data-done="' + esc(p.id) + '">再記一次</button>';
    if (l.person === cfg.person && d === t) side += '<button type="button" class="undo" data-undo="' + esc(l.id) + '">撤銷</button>';
  } else {
    status = '<span class="status">' + esc(dateLabel(x.next)) + ' 開始</span>';
  }
  const warn = x.missedPrev != null ? '<span class="warn">上一次 ' + esc(dateLabel(x.missedPrev)) + ' 沒有紀錄</span>' : '';
  return '<article class="card ' + x.state + '">' +
    '<div class="gauge" aria-hidden="true"><i style="height:' + Math.round(Math.max(0, Math.min(1, x.level)) * 100) + '%"></i></div>' +
    '<button type="button" class="body" data-open="' + esc(p.id) + '">' +
      '<span class="row1"><span class="name">' + esc(p.name) + '</span>' + qty + every + slot + '</span>' +
      '<span class="amount"><b>' + esc(p.action) + '</b>' + (p.amount ? '，' + esc(p.amount) : '') + '</span>' +
      status + warn +
    '</button>' +
    (side ? '<div class="side">' + side + '</div>' : '') +
  '</article>';
}

/* ---------- 底部面板 ---------- */
function openSheet(html) {
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#sheetWrap').classList.add('open');
}
function closeSheet() { $('#sheetWrap').classList.remove('open'); sheet = { mode: null, id: null }; peopleEdit = false; }
function refresh(force) {
  render();
  // 使用者正在輸入時不要重畫面板，避免打到一半被清掉
  const typing = document.activeElement && $('#sheet').contains(document.activeElement) && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (typing && !force) return;
  if (sheet.mode === 'task') taskSheet(sheet.id);
  else if (sheet.mode === 'settings') settingsSheet();
}

function taskSheet(id) {
  const p = plantById(id); if (!p) return closeSheet();
  sheet = { mode: 'task', id };
  const t = todayNum();
  const x = computeTask(p, allLogs(), t);
  const stateText = x.state === 'due' ? '今天要做' : x.state === 'overdue' ? '逾期 ' + x.late + ' 天' : x.state === 'done' ? '這一輪已完成' : '還沒開始';
  const people = data.people.length ? data.people : [cfg.person];
  const shown = x.logs.slice(0, 30);
  openSheet(
    '<div class="sh-head"><div><h3>' + esc(p.name) + (p.qty && p.qty !== '1' ? ' <span class="qty">× ' + esc(p.qty) + ' 盆</span>' : '') + '</h3>' +
      '<p class="meta">' + esc(p.zone) + '，' + (p.interval > 1 ? '每 ' + p.interval + ' 天' : '每天') + esc(p.action) + (p.slot ? '（' + esc(p.slot) + '）' : '') + '</p>' +
      (p.amount ? '<p class="meta">' + esc(p.amount) + '</p>' : '') + '</div>' +
      '<button type="button" class="btn small" data-edit="' + esc(p.id) + '">編輯</button></div>' +
    '<ul class="stats">' +
      '<li><span>狀態</span><span>' + stateText + '</span></li>' +
      (x.last ? '<li><span>上次</span><span>' + esc(x.last.person) + ' ' + esc(stamp(x.last.time)) + '</span></li>' : '') +
      '<li><span>' + (x.state === 'upcoming' ? '開始日' : '下次') + '</span><span>' + esc(dateLabel(x.next)) + '</span></li>' +
    '</ul>' +
    '<h4>現在記一筆</h4>' +
    '<button type="button" class="btn primary block" data-done="' + esc(p.id) + '">' + (VERB[p.action] || '完成') + '</button>' +
    '<h4>忘了記？補登</h4>' +
    '<div class="backfill">' +
      '<input type="datetime-local" id="bfTime" value="' + localInput(Date.now() - 864e5) + '" max="' + localInput(Date.now()) + '" aria-label="時間">' +
      '<select id="bfWho" aria-label="誰做的">' + people.map(n => '<option' + (n === cfg.person ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select>' +
      '<button type="button" class="btn" data-act="backfill">補登</button>' +
    '</div>' +
    '<h4>紀錄</h4>' +
    (shown.length
      ? '<ul class="logs">' + shown.map(l => '<li><time>' + esc(stamp(l.time)) + '</time><span>' + esc(l.person) + (l.pending ? '<span class="pending-dot" title="等待同步"></span>' : '') + '</span><button type="button" class="x" data-del-log="' + esc(l.id) + '">刪除</button></li>').join('') + '</ul>' +
        (x.logs.length > shown.length ? '<p class="meta">另有 ' + (x.logs.length - shown.length) + ' 筆較早的紀錄，可在試算表查看</p>' : '')
      : '<p class="meta">最近 60 天沒有紀錄。</p>')
  );
}

function editSheet(id) {
  const p = id ? plantById(id) : { name: '', zone, qty: '', action: '澆水', interval: 1, amount: '', slot: '', start: keyOf(new Date()), multi: false };
  if (!p) return closeSheet();
  sheet = { mode: 'edit', id: id || null };
  const zones = Array.from(new Set(zonesOf().concat(DEFAULT_ZONES)));
  const actions = ACTIONS.includes(p.action) ? ACTIONS : ACTIONS.concat(p.action);
  const opt = (list, v, label) => list.map(o => '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(label ? label(o) : o) + '</option>').join('');
  openSheet(
    '<div class="sh-head"><div><h3>' + (id ? '編輯「' + esc(p.name) + '」' : '新增植物') + '</h3></div></div>' +
    '<div class="form">' +
      '<label>名稱<input id="fName" value="' + esc(p.name) + '" maxlength="30" autocomplete="off" placeholder="例如：龜背芋"></label>' +
      '<div class="two">' +
        '<label>區域<select id="fZone">' + opt(zones, p.zone) + '</select></label>' +
        '<label>數量（盆）<input id="fQty" type="number" min="1" inputmode="numeric" value="' + esc(p.qty) + '" placeholder="不填"></label>' +
      '</div>' +
      '<div class="two">' +
        '<label>動作<select id="fAct">' + opt(actions, p.action) + '</select></label>' +
        '<label>每幾天一次<input id="fInt" type="number" min="1" inputmode="numeric" value="' + esc(p.interval) + '"></label>' +
      '</div>' +
      '<label>水量<input id="fAmt" value="' + esc(p.amount) + '" maxlength="40" autocomplete="off" placeholder="例如：每盆 1 牛奶桶"></label>' +
      '<div class="two">' +
        '<label>時段<select id="fSlot">' + opt(SLOTS, p.slot, s => s || '不指定') + '</select></label>' +
        '<label>起始日<input id="fStart" type="date" value="' + esc(p.start || keyOf(new Date())) + '"></label>' +
      '</div>' +
      '<small class="meta">起始日是固定排程的基準。例如每 7 天、起始日設在週一，之後就固定每週一要做。同一株一天要做兩次，就新增兩項，時段分別選早上和下班前。</small>' +
      '<label class="check"><input type="checkbox" id="fMulti"' + (p.multi ? ' checked' : '') + '>一天可以記很多次（例如室外澆水）</label>' +
      '<div class="form-actions">' +
        '<button type="button" class="btn" data-act="cancel">取消</button>' +
        '<button type="button" class="btn primary" data-act="save">儲存</button>' +
      '</div>' +
      (id ? '<button type="button" class="btn danger block" data-act="remove">移除這一項</button><p class="meta">移除後 App 不再顯示，試算表裡的資料和紀錄會保留。</p>' : '') +
    '</div>'
  );
  if (!id) $('#fName').focus();
}

async function savePlant(btn) {
  const name = $('#fName').value.trim();
  if (!name) { toast('請填寫名稱'); $('#fName').focus(); return; }
  const plant = {
    id: sheet.id || '',
    name,
    zone: $('#fZone').value,
    qty: $('#fQty').value.trim(),
    action: $('#fAct').value,
    interval: Math.max(1, parseInt($('#fInt').value, 10) || 1),
    amount: $('#fAmt').value.trim(),
    slot: $('#fSlot').value,
    start: $('#fStart').value || keyOf(new Date()),
    multi: $('#fMulti').checked
  };
  btn.disabled = true; btn.textContent = '儲存中…';
  const wasNew = !sheet.id;
  const ok = await mutate({ action: 'savePlant', plant }, wasNew ? '已新增 ' + name : '已儲存');
  if (!ok) { btn.disabled = false; btn.textContent = '儲存'; return; }
  zone = plant.zone; save(LS.zone, zone);
  if (wasNew) { closeSheet(); render(); }
  else taskSheet(sheet.id);
}

async function removePlant() {
  const p = plantById(sheet.id); if (!p) return;
  if (!confirm('移除「' + p.name + (p.slot ? '（' + p.slot + '）' : '') + '」？App 不再顯示，試算表會保留資料。')) return;
  if (await mutate({ action: 'removePlant', id: p.id }, '已移除 ' + p.name)) { closeSheet(); render(); }
}

function settingsSheet() {
  sheet = { mode: 'settings', id: null };
  const people = data ? data.people : [];
  openSheet(
    '<div class="sh-head"><div><h3>設定</h3><p class="meta">目前使用者：' + esc(cfg.person) + '</p></div></div>' +
    '<h4>誰在用這支手機</h4>' +
    '<div class="chips">' + people.map(n =>
      '<button type="button" class="chip" data-person="' + esc(n) + '" aria-pressed="' + (n === cfg.person) + '">' + esc(n) + (peopleEdit ? '<span class="rm" aria-label="移除">×</span>' : '') + '</button>').join('') + '</div>' +
    (peopleEdit
      ? '<div class="addp"><input id="newPerson" maxlength="12" autocomplete="off" placeholder="新同事的名字"><button type="button" class="btn" data-act="addPerson">新增</button></div>' +
        '<button type="button" class="btn block" data-act="peopleDone">完成</button>'
      : '<button type="button" class="btn block" data-act="peopleEdit">管理名單</button>') +
    '<h4>同步</h4>' +
    '<p class="meta" id="syncText">' + esc(syncSummary()) + '</p>' +
    '<button type="button" class="btn block" data-act="syncNow">立即同步</button>' +
    '<h4>植物</h4>' +
    '<button type="button" class="btn block" data-act="add">新增植物</button>' +
    '<p class="meta">點清單上的植物可以看紀錄、補登，右上角「編輯」可以改名稱、水量和週期。</p>' +
    '<h4>其他</h4>' +
    '<button type="button" class="btn danger block" data-act="logout">重新輸入通行碼</button>'
  );
}

/* ---------- 初次設定 ---------- */
let setupErr = '', pickPerson = '';
function renderSetup() {
  if (setupStep === 'key') {
    return '<div class="setup"><div class="panel">' +
      '<h3>接待中心澆水表</h3><p>請輸入同事給你的通行碼</p>' +
      '<input id="key" type="password" autocomplete="off" placeholder="通行碼">' +
      '<div class="errtext">' + esc(setupErr) + '</div>' +
      '<button type="button" class="btn primary block" id="keyGo">下一步</button></div></div>';
  }
  const people = (data && data.people) || [];
  return '<div class="setup"><div class="panel">' +
    '<h3>你是哪一位？</h3><p>打勾時會記錄是誰做的。</p>' +
    (people.length ? '<div class="chips">' + people.map(n => '<button type="button" class="chip" data-pick="' + esc(n) + '" aria-pressed="' + (n === pickPerson) + '">' + esc(n) + '</button>').join('') + '</div>'
      : '<p>名單是空的，請先在試算表「人員」分頁加上名字。</p>') +
    '<div class="errtext">' + esc(setupErr) + '</div>' +
    '<button type="button" class="btn primary block" id="personGo"' + (pickPerson ? '' : ' disabled') + '>開始使用</button></div></div>';
}
function bindSetup() {
  const keyGo = $('#keyGo');
  if (keyGo) {
    const input = $('#key');
    input.focus();
    const go = async () => {
      const k = input.value.trim();
      if (!k) { setupErr = '請輸入通行碼'; render(); return; }
      keyGo.disabled = true; keyGo.textContent = '連線中…';
      cfg.key = k;
      try {
        takeData(await api({ action: 'data' }));
        save(LS.cfg, cfg);
        sync.last = new Date().toISOString(); sync.error = '';
        setupErr = ''; setupStep = 'person';
      } catch (e) {
        cfg.key = '';
        setupErr = e.message === 'bad_key' ? '通行碼不對，請再確認一次' : e.message === 'offline' ? '連不上試算表，請確認網路後再試' : errText(e);
      }
      render();
    };
    keyGo.onclick = go;
    input.onkeydown = e => { if (e.key === 'Enter') go(); };
    return;
  }
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { pickPerson = b.dataset.pick; render(); });
  const personGo = $('#personGo');
  if (personGo) personGo.onclick = () => {
    if (!pickPerson) return;
    cfg.person = pickPerson; save(LS.cfg, cfg);
    setupStep = null; render(); runSync();
  };
}

/* ---------- 事件 ---------- */
document.addEventListener('click', async e => {
  if (setupStep) return;
  const t = e.target.closest('button,[data-close]');
  if (!t) return;
  const d = t.dataset;
  if (d.zone) { zone = d.zone; save(LS.zone, zone); render(); window.scrollTo(0, 0); }
  else if (d.done) markDone(d.done);
  else if (d.undo) { if (confirm('撤銷這筆紀錄？')) { removeLog(d.undo); refresh(); toast('已撤銷'); } }
  else if (d.open) taskSheet(d.open);
  else if (d.edit) editSheet(d.edit);
  else if (d.delLog) {
    const l = allLogs().find(x => x.id === d.delLog);
    if (l && confirm('刪除 ' + l.person + ' 在 ' + stamp(l.time) + ' 的紀錄？')) { removeLog(l.id); refresh(); toast('已刪除'); }
  }
  else if (d.person) {
    if (peopleEdit) {
      if (d.person === cfg.person) return toast('不能移除目前使用者，請先切換成別人');
      if (confirm('把「' + d.person + '」從名單移除？過去的紀錄會保留。')) mutate({ action: 'removePerson', name: d.person }, '已移除 ' + d.person);
    } else if (d.person !== cfg.person) {
      cfg.person = d.person; save(LS.cfg, cfg); refresh(); toast('已切換成 ' + d.person);
    }
  }
  else if ('close' in d) closeSheet();
  else if (d.act === 'sync') { if (sync.error) toast(sync.error); runSync(); }
  else if (d.act === 'settings') settingsSheet();
  else if (d.act === 'add') editSheet(null);
  else if (d.act === 'cancel') sheet.id ? taskSheet(sheet.id) : closeSheet();
  else if (d.act === 'save') savePlant(t);
  else if (d.act === 'remove') removePlant();
  else if (d.act === 'backfill') {
    const ms = new Date($('#bfTime').value).getTime();
    if (!ms) return toast('請選擇時間');
    if (ms > Date.now() + 60000) return toast('不能補登未來的時間');
    if (Date.now() - ms > 59 * 864e5) return toast('只能補登 60 天內的紀錄');
    markDone(sheet.id, $('#bfWho').value, ms);
  }
  else if (d.act === 'syncNow') runSync();
  else if (d.act === 'peopleEdit') { peopleEdit = true; settingsSheet(); }
  else if (d.act === 'peopleDone') { peopleEdit = false; settingsSheet(); }
  else if (d.act === 'addPerson') {
    const name = $('#newPerson').value.trim();
    if (!name) return toast('請輸入名字');
    if (data.people.includes(name)) return toast(name + ' 已經在名單裡');
    mutate({ action: 'addPerson', name }, '已新增 ' + name);
  }
  else if (d.act === 'logout') {
    if (!confirm('要清除通行碼並重新設定嗎？還沒同步的紀錄會保留在這支手機。')) return;
    closeSheet(); cfg = { key: '', person: '' }; save(LS.cfg, cfg); setupErr = ''; pickPerson = ''; setupStep = 'key'; render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) runSync(); });
window.addEventListener('online', () => runSync());
setInterval(() => { if (!document.hidden && !setupStep) runSync(); }, 60000);

/* ---------- 啟動 ---------- */
render();
if (cfg.key) runSync();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
